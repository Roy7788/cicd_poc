# Flow: Flutter test -> Build APK -> SonarQube quality gate -> Karate + Cucumber functional tests
name: Flutter Full CI/CD POC

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------- JOB 1: Test (analyze + functional/widget tests) ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Explicit Java 17 needed (ubuntu-latest defaults to Java 21, which breaks Gradle)
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (lint / basic quality check)
        run: flutter analyze

      - name: Run functional/widget tests with coverage
        run: flutter test --coverage

      - name: Upload coverage report (for SonarQube)
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  # ---------- JOB 2: Build (APK) - runs only after test passes ----------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ---------- JOB 3: SonarQube Quality Gate ----------
  sonarqube-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full git history required for SonarQube

      - name: Download coverage report
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: coverage/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Quality Gate check step omitted (known bug in the action); check results manually on SonarCloud

  # ---------- JOB 4: Karate Functional/API Tests ----------
  karate-functional-tests:
    needs: sonarqube-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Karate functional tests
        working-directory: ./karate_tests
        run: mvn test

      - name: Upload Karate test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: karate-report
          path: karate_tests/target/karate-reports/
          retention-days: 7

  # ---------- JOB 5: Cucumber Functional/API Tests ----------
  cucumber-functional-tests:
    needs: sonarqube-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Cucumber functional tests
        working-directory: ./cucumber_tests
        run: mvn test

      - name: Upload Cucumber test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cucumber-report
          path: cucumber_tests/target/surefire-reports/
          retention-days: 7

    # ---------- JOB 6: Deploy debug APK to Firebase App Distribution ----------
  deploy:
    needs: [karate-functional-tests, cucumber-functional-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "Automated build from CI/CD pipeline - commit ${{ github.sha }}"