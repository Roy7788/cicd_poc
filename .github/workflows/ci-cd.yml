# Flow: Flutter build+test -> SonarQube quality gate -> Karate + Cucumber functional tests -> APK artifact
name: Flutter Full CI/CD POC

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------- JOB 1: Flutter build + unit/widget (functional) tests ----------
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Explicit Java 17 needed (ubuntu-latest defaults to Java 21, which breaks Gradle)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (lint / basic quality check)
        run: flutter analyze

      - name: Run functional/widget tests with coverage
        run: flutter test --coverage

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload coverage report (for SonarQube)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  # ---------- JOB 2: SonarQube Quality Gate ----------
  sonarqube-scan:
    needs: flutter-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for SonarQube

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Quality Gate check step omitted (known bug in the action); check results manually on SonarCloud

  # ---------- JOB 3: Karate Functional/API Tests ----------
  karate-functional-tests:
    needs: sonarqube-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Karate functional tests
        working-directory: ./karate_tests
        run: mvn test

      - name: Upload Karate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-report
          path: karate_tests/target/karate-reports/
          retention-days: 7

  # ---------- JOB 4: Cucumber Functional/API Tests ----------
  cucumber-functional-tests:
    needs: sonarqube-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Cucumber functional tests
        working-directory: ./cucumber_tests
        run: mvn test

      - name: Upload Cucumber test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cucumber_tests/target/cucumber-reports/
          retention-days: 7

