# SonarQube configuration - POC
# Ye file Flutter project ke root mein rehni chahiye

sonar.projectKey=flutter-cicd-poc
sonar.organization=sandeep992050
sonar.projectName=Flutter CI/CD POC
sonar.projectVersion=1.0

# Source code location
